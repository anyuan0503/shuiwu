server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: water-monitor
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

# 业务自定义配置
water:
  jwt:
    secret: water-monitor-2026-graduation-project-secret-key-for-jwt-hs256
    expire-minutes: 720
  ai:
    base-url: http://127.0.0.1:8000
    timeout-seconds: 5
  reports-dir: ./reports

logging:
  level:
    com.water: info